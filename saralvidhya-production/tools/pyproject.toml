[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv-tools"
version = "0.1.0"
description = "SaralVidhya Content Publishing and Platform Administration CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "jsonschema>=4.17.0",
    "google-cloud-storage>=2.10.0",
    "click>=8.1.0",
]

[project.scripts]
sv-publish = "sv_tools.publish:main"
sv-admin = "sv_tools.admin:main"

[tool.setuptools.packages.find]
where = ["src"]
