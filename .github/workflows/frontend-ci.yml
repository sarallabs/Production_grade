name: Frontend CI

on:
  push:
    branches:
      - main
      - master
      - Bhanu
      - Aditya-UI
      - feature/read
    paths:
      - 'saralvidhya-mvp/**'
      - 'saralvidhya-production/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'saralvidhya-mvp/**'
      - 'saralvidhya-production/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Frontend Validation & Build Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saralvidhya-mvp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: saralvidhya-mvp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Check Multi-Tenant Literals (if configured)
        run: npm run check:tenant-literals --if-present

      - name: Run Unit Tests
        run: npm run test:vitest --if-present
        continue-on-error: true

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_GCS_API_BASE: 'https://saralvidhya-api-193782571555.asia-south1.run.app'

      - name: Secret Scan on Dist Bundle
        run: |
          echo "Scanning dist/ for leaked private credentials, service account tokens, or unredacted keys..."
          if grep -rn -E "(BEGIN [A-Z ]*PRIVATE KEY|client_secret|type\": \"service_account\")" dist/; then
            echo "ERROR: Found private credentials marker in build output!"
            exit 1
          fi
          echo "Pass: No leaked private credentials found in build bundle."

      - name: Deploy Cloudflare Pages Preview
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy saralvidhya-mvp/dist --project-name=saralvidhya --branch=${{ github.head_ref || github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
