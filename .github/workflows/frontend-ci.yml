name: Frontend CI

on:
  pull_request:
    paths:
      - 'saralvidhya-mvp/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saralvidhya-mvp

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: saralvidhya-mvp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Check Multi-Tenant Literals
        run: npm run check:tenant-literals

      - name: Run Unit Tests
        run: npm run test:vitest
        continue-on-error: true

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_GCS_API_BASE: 'https://saralvidhya-api-193782571555.asia-south1.run.app'

      - name: Secret Scan on Dist Bundle
        run: |
          echo "Scanning dist/ for leaked private credentials or service accounts..."
          if grep -rn "PRIVATE KEY" dist/; then
            echo "ERROR: Found private key marker in build output!"
            exit 1
          fi
          echo "Pass: No leaked private credentials found in build bundle."

      - name: Deploy Cloudflare Pages Preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy saralvidhya-mvp/dist --project-name=saralvidhya --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
