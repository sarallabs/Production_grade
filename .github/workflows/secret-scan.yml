name: Security Secret Scan

on:
  push:
    branches: [main, master, Bhanu, Aditya-UI, feature/read]
  pull_request:
    branches: [main, master, Bhanu, Aditya-UI, feature/read]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks & TruffleHog Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: false

      - name: Run TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          extra_args: --only-verified
