name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - Bhanu
      - Aditya-UI
      - feature/read
    paths:
      - "saralvidhya-production/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "saralvidhya-production/backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    name: Backend Validation & Build Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saralvidhya-production/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: saralvidhya-production/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high || echo "::warning::High severity vulnerabilities found in dependencies; review package-lock.json"

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Compile Backend (Generate dist/)
        run: npm run build

      - name: Docker Image Build Test
        run: docker build -t saralvidhya-backend:test .
