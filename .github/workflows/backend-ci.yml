name: Backend CI

on:
  pull_request:
    paths:
      - 'saralvidhya-production/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saralvidhya-production/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: saralvidhya-production/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Docker Image Build Test
        run: docker build -t saralvidhya-backend:test .
