name: Repo Hygiene

# Server-side backstop for .githooks/pre-commit (which can be skipped with --no-verify).
# Blocks APK/AAB/IPA, signing keys, and files > 5 MB using the SAME script as the hook.

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  large-files:
    name: Block build artifacts & large files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            BASE="$(git merge-base "$BASE" "$HEAD")"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            # New branch or manual run: compare against the default branch.
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
            HEAD="${{ github.sha }}"
            BASE="$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$HEAD")"
          fi
          echo "range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
          echo "Checking range ${BASE}..${HEAD}"

      - name: Run large-file / artifact gate
        env:
          MAX_FILE_KB: '5120'
        run: sh scripts/repo-hygiene/check-large-files.sh --range "${{ steps.range.outputs.range }}"

      - name: Fail if any build artifact is tracked at HEAD
        shell: bash
        run: |
          tracked="$(git ls-files '*.apk' '*.aab' '*.ipa' '*.keystore' '*.jks')"
          if [ -n "$tracked" ]; then
            echo "::error::Build artifacts are tracked in git:"; echo "$tracked"
            echo "Remove with: git rm --cached <file>  (publish via GitHub Releases / EAS instead)"
            exit 1
          fi
