name: Frontend Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'saralvidhya-mvp/**'
      - 'saralvidhya-production/frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    name: Build & Deploy Production Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saralvidhya-mvp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: saralvidhya-mvp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Check Multi-Tenant Literals (if configured)
        run: npm run check:tenant-literals --if-present

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_GCS_API_BASE: 'https://saralvidhya-api-193782571555.asia-south1.run.app'

      - name: Deploy to Cloudflare Pages Production
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy saralvidhya-mvp/dist --project-name=saralvidhya --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
